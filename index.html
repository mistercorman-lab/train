<script>
(function(){
  "use strict";

  const SUPABASE_URL = 'https://mvyeknoysdizrokdeyfc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_lMWOURTeE9MtY7UiCTe-CA_1SeINJhu';

  if (typeof window.supabase === 'undefined'){
    document.body.innerHTML = '<div style="color:#fff;padding:40px;text-align:center;font-family:sans-serif;">Ошибка: Supabase SDK не загрузился.<br>Проверь интернет и https://</div>';
    return;
  }
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const DEFAULT_EXERCISES = [
    { id:'pushups', name:'Отжимания',  sets:3 },
    { id:'squats',  name:'Приседания', sets:3 },
    { id:'triceps', name:'Трицепс',    sets:3 },
    { id:'biceps',  name:'Бицепс',     sets:3 },
    { id:'abs',     name:'Пресс',      sets:3 }
  ];

  const EXERCISES_KEY = 'workoutExercises_v2';
  const LOGIN_KEY = 'workoutLogin_v1';
  const REST_KEY = 'restSeconds';
  const MONTHS_RU = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  const S = {
    login: null, displayName: null, screen: 'menu', phase: 'idle',
    workStart: 0, workEnd: 0, restStart: 0, restEnd: 0,
    workoutStart: 0, finishedAt: 0, restDuration: 90 * 1000,
    exercises: [], activeExercises: [], exIdx: 0, setIdx: 0,
    pendingFinish: false, rafId: null, restTimeout: null,
    lastTimeStr: '', allWorkouts: [],
    statsMonth: new Date().getMonth(),
    statsYear: new Date().getFullYear()
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    loginScreen: $('loginScreen'), loginInput: $('loginInput'), loginBtn: $('loginBtn'), loginError: $('loginError'),
    screens: $('screens'),
    menuScreen: $('screen-menu'), setupScreen: $('screen-setup'), timerScreen: $('screen-timer'),
    finishScreen: $('screen-finish'), statsScreen: $('screen-stats'),
    greetName: $('greetName'), monthCount: $('monthCount'),
    menuStartBtn: $('menuStartBtn'), menuStatsBtn: $('menuStatsBtn'),
    calTitle: $('calTitle'), calLine: $('calLine'),
    exList: $('exList'), exAddBtn: $('exAddBtn'),
    setupStartBtn: $('setupStartBtn'), setupBackBtn: $('setupBackBtn'),
    restInputBig: $('restInputBig'), phaseLabel: $('phaseLabel'), timeDisplay: $('timeDisplay'),
    mainBtn: $('mainBtn'), skipBtn: $('skipBtn'), nextExercise: $('nextExercise'), nextName: $('nextName'),
    timerFinishBtn: $('timerFinishBtn'),
    finishStatus: $('finishStatus'), summaryList: $('summaryList'), finishBackBtn: $('finishBackBtn'),
    statsContent: $('statsContent'), statsBackBtn: $('statsBackBtn'),
    statsMonth: $('statsMonth'), statsYear: $('statsYear'),
    repsModal: $('repsModal'), repsTitle: $('repsTitle'), repsInput: $('repsInput'),
    repsOk: $('repsOk'), repsCancel: $('repsCancel'),
    addExModal: $('addExModal'), newExName: $('newExName'), newExSets: $('newExSets'),
    addExOk: $('addExOk'), addExCancel: $('addExCancel')
  };

  /* ============ УТИЛИТЫ ============ */
  function fmt(ms){
    ms = Math.max(0, ms);
    const t = Math.floor(ms / 1000);
    return String(Math.floor(t / 60)).padStart(2,'0') + ':' + String(t % 60).padStart(2,'0');
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(() => el.classList.remove('shake'), 450); }
  function dateOnly(s){ return String(s || '').split('T')[0].split(' ')[0]; }

  /* ============ АУДИО ============ */
  let audioCtx = null;
  function getAudioCtx(){
    if (!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function playBeep(){
    try {
      const ctx = getAudioCtx(); if (!ctx) return;
      const t0 = ctx.currentTime + 0.03;
      [{t:0,f:880},{t:0.22,f:880},{t:0.44,f:1174}].forEach(n => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        const start = t0 + n.t;
        osc.type = 'sine'; osc.frequency.value = n.f;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.28, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.20);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(start); osc.stop(start + 0.24);
      });
    } catch(err){}
  }
  function vibrate(){ if (navigator.vibrate){ try { navigator.vibrate([180,90,180,90,260]); } catch(e){} } }

  /* ============ API ============ */
  async function apiGetUser(login){
    try {
      const { data, error } = await supabase.from('users').select('login, display_name').eq('login', login.trim()).maybeSingle();
      if (error){ console.error(error); return { result:'error', message: error.message }; }
      if (!data) return { result:'error', message:'Пользователь не найден' };
      return { result:'success', login: data.login, displayName: data.display_name || data.login };
    } catch(err){ console.error(err); return { result:'error', message:'Ошибка соединения: ' + err.message }; }
  }
  async function apiGetHistory(login){
    try {
      const { data, error } = await supabase.from('workouts').select('*').eq('user_login', login).order('workout_date', { ascending: false }).limit(1000);
      if (error){ console.error(error); return { result:'error', message: error.message }; }
      return { result:'success', history: data || [] };
    } catch(err){ console.error(err); return { result:'error', message:'Ошибка соединения: ' + err.message }; }
  }
  async function apiSaveWorkout(login, workoutData){
    try {
      const rows = workoutData.exercises.map(ex => ({
        user_login: login, exercise_name: ex.name, sets: ex.sets, reps: ex.reps, total_time: workoutData.totalTime / 1000
      }));
      const { error } = await supabase.from('workouts').insert(rows);
      if (error){ console.error(error); return { result:'error', message: error.message }; }
      return { result:'success' };
    } catch(err){ console.error(err); return { result:'error', message:'Ошибка соединения: ' + err.message }; }
  }

  /* ============ ЭКРАНЫ ============ */
  function showScreen(name){
    const screens = { menu: els.menuScreen, setup: els.setupScreen, timer: els.timerScreen, finish: els.finishScreen, stats: els.statsScreen };
    const cur = screens[S.screen];
    const next = screens[name];
    if (!next) return;
    if (cur && cur !== next) cur.classList.remove('active');
    next.classList.add('active');
    S.screen = name;
  }

  /* ============ КАЛЕНДАРЬ ============ */
  function renderCalendar(){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
    const daysInMonth = new Date(y, m+1, 0).getDate();

    const trainedDates = new Set();
    S.allWorkouts.forEach(w => {
      const d = dateOnly(w.workout_date);
      if (!d) return;
      const parts = d.split('-').map(Number);
      if (parts[0] === y && parts[1] === m+1) trainedDates.add(parts[2]);
    });

    els.calTitle.textContent = MONTHS_RU[m] + ' ' + y;
    let html = '';
    for (let d = 1; d <= daysInMonth; d++){
      const cls = 'cal-day' + (d === today ? ' today' : '') + (trainedDates.has(d) ? ' trained' : '');
      html += '<div class="' + cls + '"><div class="dot"></div><div class="num">' + d + '</div></div>';
    }
    els.calLine.innerHTML = html;
    requestAnimationFrame(() => {
      const dayWidth = 36;
      const scrollLeft = (today - 1) * dayWidth - els.calLine.clientWidth / 2 + dayWidth / 2;
      els.calLine.scrollLeft = Math.max(0, scrollLeft);
    });
  }

  async function loadAllWorkouts(){
    const data = await apiGetHistory(S.login);
    if (data && data.result === 'success'){
      S.allWorkouts = data.history;
      updateMenuStats();
      renderCalendar();
      renderStatsScreen();
    }
  }
  function updateMenuStats(){
    const now = new Date();
    const y = now.getFullYear(), m = now.getMonth();
    const dates = new Set();
    S.allWorkouts.forEach(w => {
      const d = dateOnly(w.workout_date);
      if (!d) return;
      const [wy, wm] = d.split('-').map(Number);
      if (wy === y && wm === m+1) dates.add(d);
    });
    els.monthCount.textContent = dates.size;
  }

  /* ============ УПРАЖНЕНИЯ ============ */
  function loadExercises(){
    try {
      const raw = localStorage.getItem(EXERCISES_KEY);
      if (raw){
        const arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length){
          return arr.map(e => ({
            id: e.id || ('ex_' + Math.random().toString(36).slice(2,9)),
            name: String(e.name || 'Упражнение').slice(0,30),
            sets: Math.min(30, Math.max(1, parseInt(e.sets,10) || 3)),
            completed: []
          }));
        }
      }
    } catch(e){}
    return DEFAULT_EXERCISES.map(e => ({...e, completed: []}));
  }
  function saveExercises(){
    try { localStorage.setItem(EXERCISES_KEY, JSON.stringify(S.exercises.map(e => ({ id:e.id, name:e.name, sets:e.sets })))); } catch(e){}
  }

  function renderExerciseList(){
    els.exList.innerHTML = '';
    S.exercises.forEach((ex, i) => {
      const li = document.createElement('li');
      li.className = 'ex-row';
      li.dataset.idx = i;

      const num = document.createElement('div');
      num.className = 'ex-num';
      num.textContent = String(i + 1);

      const name = document.createElement('div');
      name.className = 'ex-name';
      name.textContent = ex.name;

      const setsInput = document.createElement('input');
      setsInput.type = 'number';
      setsInput.className = 'ex-sets';
      setsInput.min = 1; setsInput.max = 30;
      setsInput.value = ex.sets;
      setsInput.inputMode = 'none';
      attachVerticalSwipe(setsInput, { min:1, max:30, step:1, pixelsPerStep:16, onChange: (v) => { ex.sets = v; saveExercises(); } });
      setsInput.addEventListener('change', () => {
        let v = parseInt(setsInput.value, 10);
        if (isNaN(v) || v < 1) v = 1; if (v > 30) v = 30;
        setsInput.value = v; ex.sets = v; saveExercises();
      });

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'ex-remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        if (S.phase !== 'idle') return;
        S.exercises.splice(i, 1); saveExercises(); renderExerciseList();
      });

      li.appendChild(num); li.appendChild(name); li.appendChild(setsInput); li.appendChild(removeBtn);
      els.exList.appendChild(li);
      attachDragSort(li, i);
    });
  }

  function attachDragSort(li, idx){
    let startY = 0, startX = 0, dragging = false, pointerId = null, otherRows = [];
    li.addEventListener('pointerdown', (e) => {
      if (!e.target.classList.contains('ex-num')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startY = e.clientY; startX = e.clientX; pointerId = e.pointerId;

      const onMove = (ev) => {
        if (ev.pointerId !== pointerId) return;
        const dy = ev.clientY - startY, dx = ev.clientX - startX;
        if (!dragging){
          if (Math.abs(dy) < 8 && Math.abs(dx) < 8) return;
          if (Math.abs(dx) > Math.abs(dy)){ cleanup(); return; }
          dragging = true;
          li.classList.add('dragging');
          otherRows = Array.from(els.exList.querySelectorAll('.ex-row')).filter(r => r !== li);
          try { li.setPointerCapture(ev.pointerId); } catch(err){}
        }
        li.style.transform = 'translateY(' + dy + 'px)';
        const curY = ev.clientY;
        otherRows.forEach(row => {
          const r = row.getBoundingClientRect();
          row.classList.toggle('drop-target', curY >= r.top && curY <= r.bottom);
        });
      };

      const onUp = (ev) => {
        if (ev.pointerId !== pointerId) return;
        if (!dragging){ cleanup(); return; }
        const curY = ev.clientY;
        let targetIdx = idx;
        otherRows.forEach(row => {
          const r = row.getBoundingClientRect();
          if (curY >= r.top && curY <= r.bottom) targetIdx = parseInt(row.dataset.idx, 10);
        });
        if (targetIdx !== idx){
          const moved = S.exercises.splice(idx, 1)[0];
          S.exercises.splice(targetIdx, 0, moved);
          saveExercises(); renderExerciseList();
        }
        cleanup();
      };

      const onCancel = () => cleanup();
      function cleanup(){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        document.removeEventListener('pointercancel', onCancel);
        li.classList.remove('dragging');
        otherRows.forEach(r => r.classList.remove('drop-target'));
        li.style.transform = '';
        dragging = false; pointerId = null;
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onCancel);
      e.preventDefault();
    });
  }

  function attachVerticalSwipe(input, options){
    options = options || {};
    const min = options.min != null ? options.min : -Infinity;
    const max = options.max != null ? options.max : Infinity;
    const step = options.step || 1;
    const onChange = options.onChange || function(){};
    const PIXELS_PER_STEP = options.pixelsPerStep || 16;
    const HOLD_DELAY = 400;
    let startY = 0, startValue = 0, dragging = false, pointerId = null, lastCommitted = 0, holdTimer = null, accelerate = false;

    function commit(v){
      v = Math.min(max, Math.max(min, Math.round(v/step)*step));
      if (v === lastCommitted) return;
      lastCommitted = v;
      input.value = v;
      onChange(v);
    }
    function onDown(e){
      if (input.disabled) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      dragging = true; pointerId = e.pointerId;
      startY = e.clientY; startValue = parseInt(input.value, 10) || 0;
      lastCommitted = startValue; accelerate = false;
      try { input.setPointerCapture(e.pointerId); } catch(err){}
      holdTimer = setTimeout(() => { accelerate = true; input.style.borderColor = 'var(--accent)'; }, HOLD_DELAY);
    }
    function onMove(e){
      if (!dragging || e.pointerId !== pointerId) return;
      const dy = startY - e.clientY;
      const pxPer = accelerate ? PIXELS_PER_STEP / 3 : PIXELS_PER_STEP;
      commit(startValue + dy / pxPer);
      e.preventDefault();
    }
    function onUp(){
      if (!dragging) return;
      dragging = false; pointerId = null;
      if (holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
      accelerate = false; input.style.borderColor = '';
    }
    input.addEventListener('pointerdown', onDown);
    input.addEventListener('pointermove', onMove);
    input.addEventListener('pointerup', onUp);
    input.addEventListener('pointercancel', onUp);
  }

  attachVerticalSwipe(els.restInputBig, { min: 5, max: 600, step: 5, pixelsPerStep: 16,
    onChange: (v) => { S.restDuration = v * 1000; try { localStorage.setItem(REST_KEY, String(v)); } catch(e){} }
  });
  els.restInputBig.addEventListener('change', () => {
    let v = parseInt(els.restInputBig.value, 10);
    if (isNaN(v)) v = 90;
    v = Math.min(600, Math.max(5, v));
    els.restInputBig.value = v;
    S.restDuration = v * 1000;
    try { localStorage.setItem(REST_KEY, String(v)); } catch(e){}
  });

  /* ============ ТАЙМЕР ============ */
  function startWorkout(){
    const active = S.exercises.filter(e => e.sets > 0);
    if (!active.length){ shake(els.exList); return; }
    S.exercises.forEach(ex => { ex.completed = []; });
    S.activeExercises = active;
    S.exIdx = 0; S.setIdx = 0; S.pendingFinish = false;
    const now = performance.now();
    S.phase = 'work'; S.workoutStart = now; S.workStart = now;
    S.workEnd = 0; S.restStart = 0; S.restEnd = 0; S.finishedAt = 0;
    S.lastTimeStr = '';
    setSetupDisabled(true);
    setTimerUI();
    startLoop();
    showScreen('timer');
  }
  function setSetupDisabled(disabled){
    els.exList.querySelectorAll('.ex-sets, .ex-remove').forEach(el => el.disabled = disabled);
    els.exAddBtn.disabled = disabled;
  }
  function finishApproach(){
    S.workEnd = performance.now();
    S.phase = 'prompt';
    setTimerUI();
    showRepsModal();
  }
  function startRest(){
    S.phase = 'rest';
    S.restStart = performance.now();
    S.restEnd = S.restStart + S.restDuration;
    setTimerUI();
    clearTimeout(S.restTimeout);
    S.restTimeout = setTimeout(() => { if (S.phase === 'rest') endRest(false); }, S.restDuration);
    if (!S.rafId) startLoop();
  }
  function endRest(skipped){
    clearTimeout(S.restTimeout); S.restTimeout = null;
    if (!skipped){ playBeep(); vibrate(); }
    S.phase = 'work'; S.workStart = performance.now(); S.workEnd = 0;
    setTimerUI();
    if (!S.rafId) startLoop();
  }
  function recordSet(reps){
    const dur = S.workEnd - S.workStart;
    const ex = S.activeExercises[S.exIdx];
    if (!ex.completed) ex.completed = [];
    ex.completed.push({ reps: reps, dur: dur, setNum: S.setIdx + 1, t: performance.now() });
    if (S.pendingFinish){ S.pendingFinish = false; requestFinish(); return; }
    S.setIdx++;
    if (S.setIdx >= ex.sets){
      S.exIdx++; S.setIdx = 0;
      if (S.exIdx >= S.activeExercises.length){ requestFinish(); return; }
    }
    startRest();
  }
  function requestFinish(){
    clearTimeout(S.restTimeout); S.restTimeout = null;
    if (!S.finishedAt) S.finishedAt = performance.now();
    S.phase = 'idle';
    stopLoop();
    finishWorkout();
  }
  function nextExerciseName(){
    if (S.exIdx >= S.activeExercises.length) return null;
    const ex = S.activeExercises[S.exIdx];
    const isLastSetOfEx = (S.setIdx + 1 >= ex.sets);
    if (isLastSetOfEx && S.exIdx + 1 < S.activeExercises.length) return S.activeExercises[S.exIdx + 1].name;
    return ex.name;
  }
  function setTimerUI(){
    const btn = els.mainBtn;
    btn.classList.remove('work', 'wait');
    btn.disabled = false;
    if (S.phase === 'work'){
      const ex = S.activeExercises[S.exIdx];
      els.phaseLabel.textContent = ex.name + ' · подход ' + (S.setIdx + 1) + '/' + ex.sets;
      btn.textContent = 'Отдых'; btn.classList.add('work');
      els.nextExercise.classList.add('hidden');
      els.skipBtn.classList.add('hidden');
    } else if (S.phase === 'prompt'){
      const ex = S.activeExercises[S.exIdx];
      els.phaseLabel.textContent = ex.name + ' · подход ' + (S.setIdx + 1) + '/' + ex.sets;
      btn.textContent = 'Отдых'; btn.classList.add('work'); btn.disabled = true;
      els.nextExercise.classList.add('hidden');
      els.skipBtn.classList.add('hidden');
    } else if (S.phase === 'rest'){
      els.phaseLabel.textContent = 'Отдых';
      btn.textContent = 'Ожидание'; btn.classList.add('wait'); btn.disabled = true;
      els.skipBtn.classList.remove('hidden');
      const nxt = nextExerciseName();
      if (nxt){ els.nextName.textContent = nxt; els.nextExercise.classList.remove('hidden'); }
      else { els.nextExercise.classList.add('hidden'); }
    } else {
      els.phaseLabel.textContent = 'Готов к тренировке';
      btn.textContent = 'Начать';
      els.nextExercise.classList.add('hidden');
      els.skipBtn.classList.add('hidden');
    }
  }
  function update(){
    const now = performance.now();
    if (S.phase === 'work'){
      const str = fmt(now - S.workStart);
      if (str !== S.lastTimeStr){ S.lastTimeStr = str; els.timeDisplay.textContent = str; }
    } else if (S.phase === 'prompt'){
      const str = fmt(S.workEnd - S.workStart);
      if (str !== S.lastTimeStr){ S.lastTimeStr = str; els.timeDisplay.textContent = str; }
    } else if (S.phase === 'rest'){
      const remaining = S.restEnd - now;
      if (remaining <= 0){ endRest(false); return; }
      const str = fmt(remaining);
      if (str !== S.lastTimeStr){ S.lastTimeStr = str; els.timeDisplay.textContent = str; }
    }
  }
  function startLoop(){
    if (S.rafId) return;
    const loop = () => { S.rafId = requestAnimationFrame(loop); update(); };
    S.rafId = requestAnimationFrame(loop);
  }
  function stopLoop(){ if (S.rafId){ cancelAnimationFrame(S.rafId); S.rafId = null; } }

  /* ============ ФИНАЛ ============ */
  function buildWorkoutData(){
    const stats = computeStats();
    const exercises = [];
    S.activeExercises.forEach(ex => {
      const comp = ex.completed || [];
      if (!comp.length) return;
      const sets = comp.length;
      const reps = comp.reduce((s,c) => s + c.reps, 0);
      const time = comp.reduce((s,c) => s + c.dur, 0);
      exercises.push({
        name: ex.name, sets: sets, reps: reps, setReps: comp.map(c => c.reps),
        avgReps: reps / sets, totalTime: time, avgTime: time / sets
      });
    });
    return { date: new Date().toISOString(), totalTime: stats.total, workTime: stats.work, restTime: stats.rest, exercises: exercises };
  }
  function computeStats(){
    const isFinished = S.phase === 'idle' && S.finishedAt;
    let now;
    if (isFinished) now = S.finishedAt;
    else if (S.phase === 'prompt') now = S.workEnd;
    else now = performance.now();
    let work = 0;
    S.activeExercises.forEach(ex => (ex.completed || []).forEach(c => { work += c.dur; }));
    if (S.phase === 'work') work += now - S.workStart;
    else if (S.phase === 'prompt') work += S.workEnd - S.workStart;
    let total = 0;
    if (S.workoutStart) total = Math.max(0, now - S.workoutStart);
    return { work, rest: Math.max(0, total - work), total };
  }
  async function finishWorkout(){
    const workoutData = buildWorkoutData();
    showFinishScreen(workoutData);
    showScreen('finish');
    setFinishStatus('sending', '⏳ Сохраняем в базу данных...');
    if (workoutData.exercises.length === 0){ setFinishStatus('error', 'Нет выполненных подходов'); return; }
    const res = await apiSaveWorkout(S.login, workoutData);
    if (res && res.result === 'success'){
      setFinishStatus('saved', '✓ Сохранено');
      loadAllWorkouts();
    } else {
      setFinishStatus('error', 'Ошибка: ' + ((res && res.message) || 'не удалось сохранить'));
    }
  }
  function showFinishScreen(workout){
    let html = '';

    if (!workout.exercises.length){
      html = '<div class="summary-card" style="text-align:center;color:var(--muted);">Нет выполненных подходов</div>';
    } else {
      workout.exercises.forEach(ex => {
        const setLines = ex.setReps.map((r, i) =>
          'Подход ' + (i+1) + ' — <b>' + r + '</b>'
        ).join(' &nbsp;·&nbsp; ');

        html +=
          '<div class="summary-card">' +
            '<div class="ex-name">' + escapeHtml(ex.name) + '</div>' +
            '<div class="row"><span>Подходов</span><b>' + ex.sets + '</b></div>' +
            '<div class="set-lines">' + setLines + '</div>' +
            '<div class="row"><span>Среднее время на подход</span><b>' + fmt(ex.avgTime) + '</b></div>' +
            '<div class="total-reps">' +
              '<span>Всего повторений</span>' +
              '<span class="big">' + ex.reps + '</span>' +
            '</div>' +
          '</div>';
      });
    }

    html +=
      '<div class="summary-totals">' +
        '<div class="row"><span>Общее время</span><b>' + fmt(workout.totalTime) + '</b></div>' +
        '<div class="row"><span>Работа</span><b>' + fmt(workout.workTime) + '</b></div>' +
        '<div class="row"><span>Отдых</span><b>' + fmt(workout.restTime) + '</b></div>' +
      '</div>';

    els.summaryList.innerHTML = html;
    els.finishStatus.className = 'finish-status';
    els.finishStatus.textContent = '';
  }
  function setFinishStatus(type, text){ els.finishStatus.className = 'finish-status show ' + type; els.finishStatus.textContent = text; }

  /* ============ МОДАЛКИ ============ */
  function showRepsModal(){
    const ex = S.activeExercises[S.exIdx];
    const setNum = S.setIdx + 1;
    els.repsTitle.textContent = ex.name + ' — подход ' + setNum + '/' + ex.sets;
    els.repsInput.value = '';
    if (document.activeElement && document.activeElement.blur){ try { document.activeElement.blur(); } catch(e){} }
    els.repsModal.classList.add('show');
    try { els.repsInput.focus(); els.repsInput.select(); } catch(e){}
    requestAnimationFrame(() => {
      if (els.repsModal.classList.contains('show') && document.activeElement !== els.repsInput){
        try { els.repsInput.focus(); els.repsInput.select(); } catch(e){}
      }
    });
  }
  function submitReps(){
    let reps = parseInt(els.repsInput.value, 10);
    if (isNaN(reps) || reps < 0) reps = 0;
    if (reps > 999) reps = 999;
    els.repsModal.classList.remove('show');
    recordSet(reps);
  }
  function cancelReps(){
    els.repsModal.classList.remove('show');
    if (S.pendingFinish) S.pendingFinish = false;
    S.phase = 'work'; S.workEnd = 0;
    setTimerUI();
    if (!S.rafId) startLoop();
  }
  els.repsOk.addEventListener('click', submitReps);
  els.repsCancel.addEventListener('click', cancelReps);
  els.repsInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); submitReps(); }
    else if (e.key === 'Escape'){ e.preventDefault(); cancelReps(); }
  });

  function openAddEx(){
    els.newExName.value = ''; els.newExSets.value = 3;
    els.addExModal.classList.add('show');
    requestAnimationFrame(() => { try { els.newExName.focus(); } catch(e){} });
  }
  function closeAddEx(){ els.addExModal.classList.remove('show'); }
  function submitAddEx(){
    const name = els.newExName.value.trim();
    if (!name){ shake(els.newExName); return; }
    const sets = parseInt(els.newExSets.value, 10) || 3;
    S.exercises.push({
      id: 'ex_' + Math.random().toString(36).slice(2,9),
      name: name.slice(0,30), sets: Math.min(30, Math.max(1, sets)), completed: []
    });
    saveExercises();
    renderExerciseList();
    closeAddEx();
  }
  els.exAddBtn.addEventListener('click', openAddEx);
  els.addExOk.addEventListener('click', submitAddEx);
  els.addExCancel.addEventListener('click', closeAddEx);
  els.newExName.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); submitAddEx(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeAddEx(); }
  });
  els.newExSets.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); submitAddEx(); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeAddEx(); }
  });

  /* ============ КНОПКИ ============ */
  els.mainBtn.addEventListener('click', () => { getAudioCtx(); if (S.phase === 'work'){ finishApproach(); } });
  els.skipBtn.addEventListener('click', () => { if (S.phase === 'rest') endRest(true); });
  els.setupStartBtn.addEventListener('click', () => { startWorkout(); });
  els.setupBackBtn.addEventListener('click', () => { showScreen('menu'); });
  els.menuStartBtn.addEventListener('click', () => { renderExerciseList(); showScreen('setup'); });
  els.menuStatsBtn.addEventListener('click', () => { renderStatsScreen(); showScreen('stats'); });
  els.statsBackBtn.addEventListener('click', () => { showScreen('menu'); });
  els.finishBackBtn.addEventListener('click', () => { resetAfterFinish(); showScreen('menu'); });

  els.timerFinishBtn.addEventListener('click', () => {
    if (S.phase === 'idle') return;
    if (confirm('Завершить тренировку?')){
      if (S.phase === 'work'){
        const dur = performance.now() - S.workStart;
        if (dur > 2000){
          S.workEnd = performance.now();
          S.phase = 'prompt';
          S.pendingFinish = true;
          setTimerUI();
          showRepsModal();
          return;
        }
      }
      requestFinish();
    }
  });

  /* ============ СТАТИСТИКА ============ */
  function fillStatsFilters(){
    const monthSel = els.statsMonth;
    const yearSel = els.statsYear;
    monthSel.innerHTML = '';
    MONTHS_RU.forEach((name, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = name;
      monthSel.appendChild(o);
    });

    const years = new Set();
    S.allWorkouts.forEach(w => {
      const d = dateOnly(w.workout_date);
      if (!d) return;
      const y = parseInt(d.split('-')[0], 10);
      if (!isNaN(y)) years.add(y);
    });
    years.add(new Date().getFullYear());

    yearSel.innerHTML = '';
    Array.from(years).sort((a,b) => b - a).forEach(y => {
      const o = document.createElement('option');
      o.value = y;
      o.textContent = y;
      yearSel.appendChild(o);
    });

    monthSel.value = S.statsMonth;
    yearSel.value = S.statsYear;
  }

  function renderStatsScreen(){
    fillStatsFilters();

    const m = parseInt(els.statsMonth.value, 10);
    const y = parseInt(els.statsYear.value, 10);

    const filtered = S.allWorkouts.filter(w => {
      const d = dateOnly(w.workout_date);
      if (!d) return false;
      const [wy, wm] = d.split('-').map(Number);
      return wy === y && wm === m+1;
    });

    if (!filtered.length){
      els.statsContent.innerHTML = '<div class="stats-empty">В этом месяце тренировок нет</div>';
      return;
    }

    const byDate = {};
    filtered.forEach(row => {
      const d = dateOnly(row.workout_date);
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(row);
    });

    let html = '';
    Object.keys(byDate).sort().reverse().forEach(dateStr => {
      const rows = byDate[dateStr];
      const firstRow = rows[0];
      const totalTime = firstRow.total_time ? fmt(parseFloat(firstRow.total_time) * 1000) : '—';

      html += '<div class="stats-item">';
      html += '<div class="h-date">' + dateStr + '</div>';
      html += '<div class="h-meta">Всего ' + totalTime + '</div>';

      rows.forEach(r => {
        const reps = r.reps || 0, sets = r.sets || 0;
        const avg = sets ? (reps / sets).toFixed(1) : '0';
        html += '<div class="stats-ex"><span class="name">' + escapeHtml(r.exercise_name) + '</span><span class="reps">' + sets + '×  ·  <b>' + reps + '</b> повт  ·  ср. ' + avg + '</span></div>';
      });

      html += '</div>';
    });

    els.statsContent.innerHTML = html;
  }

  els.statsMonth.addEventListener('change', renderStatsScreen);
  els.statsYear.addEventListener('change', renderStatsScreen);

  /* ============ СБРОС ============ */
  function resetAfterFinish(){
    stopLoop();
    clearTimeout(S.restTimeout); S.restTimeout = null;
    S.phase = 'idle';
    S.workStart = 0; S.workEnd = 0; S.restStart = 0; S.restEnd = 0;
    S.workoutStart = 0; S.finishedAt = 0;
    S.activeExercises = []; S.exIdx = 0; S.setIdx = 0;
    S.pendingFinish = false; S.lastTimeStr = '';
    S.exercises.forEach(ex => { ex.completed = []; });
    setSetupDisabled(false);
    setTimerUI();
    renderCalendar();
  }

  /* ============ ЛОГИН ============ */
  async function doLogin(login){
    if (!login || !login.trim()){
      els.loginError.textContent = 'Введите логин';
      return;
    }
    els.loginError.textContent = '';
    els.loginBtn.disabled = true;
    els.loginBtn.textContent = 'Проверяем...';

    try {
      const data = await apiGetUser(login);

      if (data && data.result === 'success'){
        S.login = data.login;
        S.displayName = data.displayName;
        try { localStorage.setItem(LOGIN_KEY, S.login); } catch(e){}

        els.loginScreen.classList.add('hidden');
        els.screens.style.display = 'block';
        els.greetName.textContent = S.displayName;

        try {
          const saved = parseInt(localStorage.getItem(REST_KEY), 10);
          if (!isNaN(saved) && saved >= 5 && saved <= 600){
            els.restInputBig.value = saved;
            S.restDuration = saved * 1000;
          }
        } catch(e){}

        S.exercises = loadExercises();

        // Меню показываем СРАЗУ — не ждём данные
        showScreen('menu');

        // Данные грузим в фоне
        loadAllWorkouts();
      } else {
        els.loginError.textContent = (data && data.message) || 'Ошибка входа';
        els.loginInput.classList.add('shake');
        setTimeout(() => els.loginInput.classList.remove('shake'), 450);
      }
    } catch(err){
      console.error(err);
      els.loginError.textContent = 'Ошибка: ' + err.message;
    } finally {
      els.loginBtn.disabled = false;
      els.loginBtn.textContent = 'Войти';
    }
  }

  els.loginBtn.addEventListener('click', () => doLogin(els.loginInput.value));
  els.loginInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); doLogin(els.loginInput.value); }
  });

  /* ============ СВАЙП НАЗАД ИЗ ПОКАЗАТЕЛЕЙ ============ */
  (function initStatsSwipe(){
    let startX = 0, startY = 0, dragging = false, pointerId = null, decided = false;
    els.statsScreen.addEventListener('pointerdown', (e) => {
      if (S.screen !== 'stats') return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      // Игнорируем свайп по select
      if (e.target.closest('select')) return;
      startX = e.clientX; startY = e.clientY;
      dragging = true; decided = false;
      pointerId = e.pointerId;
    });
    els.statsScreen.addEventListener('pointermove', (e) => {
      if (!dragging || e.pointerId !== pointerId) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (!decided){
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (Math.abs(dy) > Math.abs(dx)){ dragging = false; return; }
        decided = true;
        try { els.statsScreen.setPointerCapture(e.pointerId); } catch(err){}
      }
      if (dx > 0){
        els.statsScreen.style.transform = 'translateX(' + dx + 'px)';
        els.statsScreen.style.transition = 'none';
      }
      e.preventDefault();
    });
    function onUp(e){
      if (!dragging || (pointerId !== null && e.pointerId !== pointerId)) return;
      dragging = false; pointerId = null;
      const dx = e.clientX - startX;
      els.statsScreen.style.transition = '';
      els.statsScreen.style.transform = '';
      if (dx > 100){
        showScreen('menu');
      }
    }
    els.statsScreen.addEventListener('pointerup', onUp);
    els.statsScreen.addEventListener('pointercancel', onUp);
  })();

  /* ============ АВТО-ВХОД УБРАН ============ */

})();
</script>
</body>
</html>
